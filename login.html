<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin &amp; Staff Login | Guest Book Portal</title>
  <meta name="description" content="Sign in to the Guest Book & Visitor Log management portal.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    /* Dedicated Login Page Styles */
    .login-page-body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: radial-gradient(circle at 50% 0%, #f0f7ff 0%, #f8fafc 70%, #eff6ff 100%);
    }

    [data-theme="dark"] .login-page-body {
      background: radial-gradient(circle at 50% 0%, #131b2e 0%, #090d16 70%, #101626 100%);
    }

    .login-page-header {
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width: 1240px;
      margin: 0 auto;
      width: 100%;
    }

    .login-main-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 20px;
    }

    .login-box {
      width: 100%;
      max-width: 440px;
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 36px 32px;
      box-shadow: var(--shadow-modal);
      position: relative;
    }

    .back-nav-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--text-muted);
      font-size: 13.5px;
      font-weight: 600;
      margin-bottom: 20px;
      padding: 6px 12px;
      border-radius: var(--radius-sm);
      background-color: var(--bg-card-subtle);
      border: 1px solid var(--border-color);
      transition: var(--transition);
    }

    .back-nav-btn:hover {
      color: var(--primary);
      border-color: var(--primary);
    }

    .login-header-text {
      margin-bottom: 24px;
    }

    .login-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: var(--radius-full);
      background-color: var(--primary-light);
      color: var(--primary);
      font-size: 11.5px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .login-title {
      font-size: 26px;
      font-weight: 800;
      color: var(--text-main);
      letter-spacing: -0.02em;
      margin-bottom: 6px;
    }

    .login-subtitle {
      font-size: 14px;
      color: var(--text-muted);
    }

    .remember-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .remember-label {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }

    .remember-label input {
      accent-color: var(--primary);
      width: 15px;
      height: 15px;
    }

    .login-footer-info {
      text-align: center;
      margin-top: 24px;
      font-size: 12.5px;
      color: var(--text-muted);
    }
  </style>
</head>
<body class="login-page-body">

  <!-- Minimal Header with Logo & Theme Toggle -->
  <header class="login-page-header">
    <a href="index.html" class="brand-wrapper" title="Back to Guest Book">
      <div class="brand-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"/>
          <path d="M6 6h10"/>
          <path d="M6 10h10"/>
          <path d="M6 14h6"/>
        </svg>
      </div>
      <div class="brand-text">
        <h1 class="brand-title">Guest Book</h1>
        <span class="brand-subtitle">Visitor Log Portal</span>
      </div>
    </a>

    <div class="header-actions">
      <button class="icon-btn theme-toggle-btn" id="themeToggleBtn" title="Toggle Theme" aria-label="Toggle Theme">
        <svg class="sun-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="5"/>
          <line x1="12" y1="1" x2="12" y2="3"/>
          <line x1="12" y1="21" x2="12" y2="23"/>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
          <line x1="1" y1="12" x2="3" y2="12"/>
          <line x1="21" y1="12" x2="23" y2="12"/>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
        <svg class="moon-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>
      <a href="index.html" class="btn btn-outline-sm">
        ← Back to Guest Book
      </a>
    </div>
  </header>

  <!-- Login Card Container -->
  <main class="login-main-container">
    <div class="login-box">
      <a href="index.html" class="back-nav-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
        <span>Back to Visitor Logs</span>
      </a>

      <div class="login-header-text">
        <div class="login-badge">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <span>Staff &amp; Admin Portal</span>
        </div>
        <h2 class="login-title">Sign in to Guest Book</h2>
        <p class="login-subtitle">Enter your credentials to manage visitor records, export logs, and perform audits.</p>
      </div>

      <form class="modal-form" id="pageLoginForm" novalidate>
        <div class="form-group">
          <label for="pageLoginEmail" class="form-label">Username / Work Email</label>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                <polyline points="22,6 12,13 2,6"/>
              </svg>
            </span>
            <input 
              type="text" 
              id="pageLoginEmail" 
              class="form-control" 
              placeholder="e.g. admin or staff@company.com" 
              value="admin"
              required
              autocomplete="username"
            >
          </div>
        </div>

        <div class="form-group">
          <label for="pageLoginPassword" class="form-label">Password</label>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
            </span>
            <input 
              type="password" 
              id="pageLoginPassword" 
              class="form-control" 
              placeholder="Enter your password" 
              value="admin123"
              required
              autocomplete="current-password"
            >
            <button type="button" class="password-toggle-btn" id="pageTogglePasswordBtn" title="Show/Hide Password">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <div class="remember-row">
          <label class="remember-label">
            <input type="checkbox" id="rememberMe" checked>
            <span>Stay signed in</span>
          </label>
          <span class="demo-credential-pill">Demo: <strong>admin</strong> / <strong>admin123</strong></span>
        </div>

        <div class="modal-actions" style="margin-top: 14px;">
          <button type="submit" class="btn btn-primary btn-block" id="pageSubmitBtn">
            <span>Sign In to Dashboard</span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="9 18 15 12 9 6"/>
            </svg>
          </button>
          <button type="button" class="btn btn-outline btn-block" id="pageQuickDemoBtn">
            ⚡ Quick 1-Click Demo Login
          </button>
        </div>
      </form>

      <div class="login-footer-info">
        <p>Guest Book Visitor Management System &bull; Version 2.4.0</p>
      </div>
    </div>
  </main>

  <!-- Toast Notification Container -->
  <div class="toast-container" id="toastContainer"></div>

  <script>
    (function() {
      // Load saved theme
      const savedTheme = localStorage.getItem('guestbook_theme') || 'light';
      document.documentElement.setAttribute('data-theme', savedTheme);

      // Theme toggle
      document.getElementById('themeToggleBtn').addEventListener('click', () => {
        const current = document.documentElement.getAttribute('data-theme') || 'light';
        const next = current === 'light' ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('guestbook_theme', next);
      });

      // Password toggle
      const passInput = document.getElementById('pageLoginPassword');
      document.getElementById('pageTogglePasswordBtn').addEventListener('click', () => {
        passInput.type = passInput.type === 'password' ? 'text' : 'password';
      });

      // Backend API Base URL
      const API_BASE = (window.location.port === '5000' || window.location.port === '')
        ? ''
        : 'http://localhost:5000';

      // Submit
      document.getElementById('pageLoginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const submitBtn = document.getElementById('pageSubmitBtn');
        const email = document.getElementById('pageLoginEmail').value.trim();
        const pass = passInput.value.trim();

        if (!email || !pass) {
          showToast('Validation Error', 'Please enter your username/email and password.', 'error');
          return;
        }

        submitBtn.disabled = true;
        const originalText = submitBtn.innerHTML;
        submitBtn.innerHTML = '<span>Verifying...</span>';

        try {
          const response = await fetch(`${API_BASE}/api/auth/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ identifier: email, password: pass })
          });

          const data = await response.json();

          if (response.ok && data.success) {
            localStorage.setItem('guestbook_auth', JSON.stringify(data.user));
            if (data.token) {
              localStorage.setItem('guestbook_token', data.token);
            }
            showToast('Sign In Successful', `Welcome back, ${data.user.username}! Redirecting...`, 'success');
            setTimeout(() => {
              window.location.href = 'index.html';
            }, 600);
            return;
          } else {
            showToast('Authentication Failed', data.error || 'Invalid username or password.', 'error');
          }
        } catch (netErr) {
          console.warn('Backend unavailable, falling back to local demo check', netErr);
          // Graceful fallback for offline demo
          if ((email === 'admin' || email.includes('@')) && pass.length >= 4) {
            const user = {
              username: email === 'admin' ? 'Admin' : email.split('@')[0],
              email: email === 'admin' ? 'admin@guestbook.io' : email,
              role: 'Staff'
            };
            localStorage.setItem('guestbook_auth', JSON.stringify(user));
            showToast('Sign In Successful (Offline)', 'Redirecting to visitor dashboard...', 'success');
            setTimeout(() => {
              window.location.href = 'index.html';
            }, 600);
            return;
          } else {
            showToast('Invalid Credentials', 'Use demo credentials: admin / admin123', 'error');
          }
        } finally {
          submitBtn.disabled = false;
          submitBtn.innerHTML = originalText;
        }
      });

      // Quick 1-Click Demo Login
      document.getElementById('pageQuickDemoBtn').addEventListener('click', async () => {
        const demoBtn = document.getElementById('pageQuickDemoBtn');
        demoBtn.disabled = true;
        demoBtn.textContent = '⚡ Signing In...';

        try {
          const response = await fetch(`${API_BASE}/api/auth/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ identifier: 'admin', password: 'admin123' })
          });
          const data = await response.json();
          if (response.ok && data.success) {
            localStorage.setItem('guestbook_auth', JSON.stringify(data.user));
            if (data.token) localStorage.setItem('guestbook_token', data.token);
            showToast('Demo Login Active', 'Welcome Admin! Redirecting to visitor dashboard...', 'success');
            setTimeout(() => window.location.href = 'index.html', 600);
            return;
          }
        } catch (e) {
          console.warn('Backend offline, using local fallback', e);
        }

        const user = {
          username: 'Admin',
          email: 'admin@guestbook.io',
          role: 'Staff'
        };
        localStorage.setItem('guestbook_auth', JSON.stringify(user));
        showToast('Demo Login Active', 'Welcome Admin! Redirecting to visitor dashboard...', 'success');
        setTimeout(() => window.location.href = 'index.html', 600);
      });

      function showToast(title, message, type = 'info') {
        const toast = document.createElement('div');
        toast.className = `toast toast-${type}`;
        toast.innerHTML = `
          <div class="toast-content">
            <div class="toast-title">${title}</div>
            <div class="toast-message">${message}</div>
          </div>
        `;
        document.getElementById('toastContainer').appendChild(toast);
        setTimeout(() => toast.remove(), 3500);
      }
    })();
  </script>
</body>
</html>
